name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_LOCAL: model-api:ci

jobs:
  # 1. Code quality, unit tests and the model quality gate -------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and API tests (coverage must stay >= 85%)
        run: pytest --junitxml=test-results.xml
      - name: Train and apply the quality gate
        run: python -m model.train --out artifacts --version "${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-and-test-results
          path: |
            artifacts/metadata.json
            test-results.xml

  # 2. Infrastructure code checks (no cloud account needed) ------------------
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Kubernetes manifests match the API schema
        run: |
          kubectl kustomize k8s > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 /w/rendered.yaml

  # 3. Build the image, scan it, run it, deploy it to a throwaway cluster ----
  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_LOCAL }}
          build-args: MODEL_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security scan (fail on fixable HIGH/CRITICAL vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL --no-progress ${{ env.IMAGE_LOCAL }}

      - name: Run the container and smoke test it
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp ${{ env.IMAGE_LOCAL }}
          scripts/smoke_test.sh http://localhost:8000
          docker logs api | tail -5
          docker rm -f api

      - name: Create a Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Deploy to Kubernetes and wait for the rollout
        run: |
          kind load docker-image ${{ env.IMAGE_LOCAL }} --name ci
          kubectl kustomize k8s \
            | sed "s#ghcr.io/quintonmcreynolds/mlops-delivery-pipeline:latest#${{ env.IMAGE_LOCAL }}#" \
            | kubectl apply -f -
          kubectl -n model-service rollout status deploy/model-api --timeout=180s
          kubectl -n model-service get pods -o wide

      - name: Smoke test through the Kubernetes Service
        run: |
          kubectl -n model-service port-forward svc/model-api 8080:80 >/tmp/pf.log 2>&1 &
          sleep 3
          scripts/smoke_test.sh http://localhost:8080

      - name: Zero-downtime rolling update
        run: |
          # Change the config, which restarts the pods one at a time. Keep calling
          # the API the whole time; a single failed request fails the job.
          kubectl -n model-service port-forward svc/model-api 8081:80 >/tmp/pf2.log 2>&1 &
          sleep 3
          ( fails=0; for i in $(seq 1 120); do
              curl -fsS -o /dev/null http://localhost:8081/readyz || fails=$((fails+1)); sleep 0.5
            done; echo "$fails" > /tmp/fails ) &
          kubectl -n model-service set env deploy/model-api LOG_LEVEL=DEBUG
          kubectl -n model-service rollout status deploy/model-api --timeout=180s
          wait
          echo "failed requests during rollout: $(cat /tmp/fails)"
          [ "$(cat /tmp/fails)" -le 2 ]

      - name: Debug info on failure
        if: failure()
        run: |
          kubectl -n model-service describe pods || true
          kubectl -n model-service logs -l app=model-api --tail=50 || true

  # 4. Publish the image (only from main or a version tag) -------------------
  publish:
    needs: [test, infra, container]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MODEL_VERSION=${{ github.sha }}
          cache-from: type=gha
